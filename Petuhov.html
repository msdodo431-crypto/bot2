<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МДК Поиск</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8 text-slate-800">


    <div class="w-full max-w-2xl mt-12 md:mt-20 flex flex-col items-center">
        
  
        <div class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-slate-900">
                <span class="text-blue-600">МДК</span> Поиск
            </h1>
        </div>

        <form id="searchForm" class="w-full relative mb-8" onsubmit="handleSearch(event)">
            <div class="relative flex items-center shadow-lg rounded-2xl overflow-hidden bg-white border border-slate-200 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100 transition-all">

                <div class="pl-4 text-slate-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <input 
                    type="text" 
                    id="searchInput" 
                    list="questionsDatalist" 
                    placeholder="Введите запрос..." 
                    class="w-full py-4 px-4 text-base md:text-lg text-slate-800 focus:outline-none bg-transparent"
                    autocomplete="off"
                    required
                />


                <datalist id="questionsDatalist"></datalist>

                <button 
                    type="submit" 
                    class="mr-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-xl transition-colors duration-200 flex items-center gap-2"
                >
                    Найти
                </button>
            </div>
        </form>


        <div id="resultCard" class="w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-8 hidden transition-all duration-300">

            <div class="flex items-center justify-between gap-2 mb-3">
                <span id="resTopic" class="text-xs font-semibold px-3 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-100">
                    Тема МДК
                </span>
                <span id="resAuthor" class="text-xs text-slate-400 font-medium">Студент</span>
            </div>

            <h2 id="resQuestion" class="text-xl md:text-2xl font-bold text-slate-900 mb-4 leading-snug">
                Вопрос
            </h2>

            <div id="resAnswer" class="text-slate-600 text-base leading-relaxed space-y-3 mb-6">

            </div>

            <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-sm">
                <span class="text-slate-500 flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Проверенный источник:
                </span>
                <a id="resSourceLink" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-blue-600 font-semibold hover:underline hover:text-blue-800 transition-colors">
                    <span id="resSourceText">Перейти на сайт</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>
        </div>

    </div>

    <script>

        const mdkDatabase = [
            {
                id: 29,
                author: "Петухов Артем Сергеевич",
                question: "29. Электронный документооборот?",
                topic: "Тема 1.1.3",
                answer: "СЭД обеспечивает создание, передачу, архивное хранение и подписанием документов с использованием усиленной квалифицированной электронной подписи (КЭП) по стандарту 63-ФЗ.",
                sourceName: "КонсультантПлюс (ФЗ № 63-ФЗ Об ЭП)",
                sourceUrl: "https://www.consultant.ru/document/cons_doc_LAW_112701/"
            },
            {
                id: 30,
                author: "Петухов Артем Сергеевич",
                question: "30. Технические меры защиты информации в автоматизированных системах?",
                topic: "Тема 1.4.1",
                answer: "Включают организационные, правовые, криптографические и программно-аппаратные меры: межсетевые экраны, криптошлюзы, средства защиты от НСД, системы DLP, биометрический контроль.",
                sourceName: "ФСТЭК России (Методические документы)",
                sourceUrl: "https://fstec.ru/tekhnicheskaya-zashchita-informatsii"
            }
        ];

        window.onload = function() {
            const datalist = document.getElementById('questionsDatalist');
            mdkDatabase.forEach((item) => {
                const option = document.createElement('option');
                option.value = `${item.id}. ${item.question.replace(/^\d+\.\s*/, '')}`;
                datalist.appendChild(option);
            });
        };

        function handleSearch(event) {
            event.preventDefault();

            const rawInput = document.getElementById('searchInput').value.trim();
            if (!rawInput) return;

            const resultCard = document.getElementById('resultCard');

            let foundMatch = null;

            if (/^\d+$/.test(rawInput)) {
                const searchNumber = parseInt(rawInput, 10);
                foundMatch = mdkDatabase.find(item => item.id === searchNumber);
            } else {

                const cleanQuery = rawInput.toLowerCase();
                foundMatch = mdkDatabase.find(item => 
                    item.question.toLowerCase().includes(cleanQuery) ||
                    item.author.toLowerCase().includes(cleanQuery) ||
                    item.topic.toLowerCase().includes(cleanQuery)
                );
            }

            if (foundMatch) {
                document.getElementById('resTopic').innerText = foundMatch.topic;
                document.getElementById('resAuthor').innerText = foundMatch.author;
                document.getElementById('resQuestion').innerText = foundMatch.question;
                document.getElementById('resAnswer').innerHTML = `<p>${foundMatch.answer}</p>`;
                
                document.getElementById('resSourceText').innerText = foundMatch.sourceName;
                document.getElementById('resSourceLink').href = foundMatch.sourceUrl;
                resultCard.classList.remove('hidden');
            } else {

                resultCard.classList.add('hidden');
                alert("По вашему запросу ничего не найдено.");
            }
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }
    </script>
</body>
</html>
